name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  server:
    name: Server (API tests + seed + smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests (Jest + Supertest)
        run: npm test

      - name: Create database with sample data
        run: npm run seed

      - name: Start server and check GET /api/health
        run: |
          npm start &
          for i in $(seq 1 20); do
            if curl -fs http://localhost:3001/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          node -e '
            fetch("http://localhost:3001/api/health")
              .then((res) => {
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.json();
              })
                           .then((data) => {
                console.log("Response:", JSON.stringify(data));
                if (data.status !== "ok") {
                  throw new Error("Health check failed");
                }
                console.log("API smoke test passed");
              })
              .catch((err) => {
                console.error(err.message);
                process.exit(1);
              });
          '

  client:
    name: Client (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
